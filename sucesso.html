<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>neXus — Ativado!</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #0a0a0a; color: #f0e6c8; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .card { text-align: center; max-width: 380px; padding: 3rem 2rem; background: #111; border: 1px solid rgba(212,175,55,0.25); border-radius: 20px; box-shadow: 0 0 60px rgba(212,175,55,0.08); }
    .icon { font-size: 3.5rem; margin-bottom: 1.5rem; }
    h1 { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 800; color: #d4af37; margin-bottom: .75rem; }
    p { color: #a89060; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✦</div>
    <h1 id="title">Plano ativado!</h1>
    <p>Volte ao WhatsApp — o neXus já está esperando por você.</p>
  </div>
  <script>
    const plan = new URLSearchParams(location.search).get('plan');
    document.getElementById('title').textContent = plan === 'pro' ? 'Plano Pro ⭐ ativado!' : 'Plano Básico ativado!';
  </script>
</body>
</html>
